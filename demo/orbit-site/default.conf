server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Fill the page with facts from this sandbox: container hostname (= team name) and its IP.
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '__TEAM__' '$hostname';
    sub_filter '__IP__'   '$server_addr';

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
