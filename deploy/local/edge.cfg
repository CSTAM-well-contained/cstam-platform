# edge: plays FelCloud's public floating IP (1:1 NAT to the VIP). It forwards every TCP
# connection from the laptop (port 8000) to the VIP 10.20.0.10, held by whichever gateway is
# MASTER. It knows nothing about teams: routing by Host header is the gateways' job.
global
    log stdout format raw local0 warning
defaults
    mode tcp
    timeout connect 1s
    timeout client 30s
    timeout server 30s
frontend public
    bind :8000
    default_backend vip
backend vip
    server vip 10.20.0.10:80
